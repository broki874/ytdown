<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical — Shorts downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --concrete:#d9dfe0;
    --concrete-deep:#c3cccd;
    --ink:#101619;
    --violet:#4b2ed9;
    --amber:#f2b705;
    --frame-w:min(300px, 78vw);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--concrete);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;
    display:flex;justify-content:center;
    padding:clamp(20px,5vw,56px) 20px 64px;
  }
  .shell{width:100%;max-width:760px}

  /* ---- masthead: the type is set tall and narrow, like the format ---- */
  header{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:36px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  h1{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;font-size:clamp(56px,13vw,116px);
    line-height:.78;letter-spacing:-.01em;text-transform:uppercase;
  }
  h1 em{font-style:normal;color:var(--violet)}
  .sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.62;padding-bottom:6px;text-align:right;line-height:1.7}

  /* ---- input ---- */
  form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input[type=url]{
    flex:1 1 260px;background:transparent;border:2px solid var(--ink);border-radius:0;
    padding:15px 16px;font:500 16px 'Space Grotesk',sans-serif;color:var(--ink);
  }
  input[type=url]::placeholder{color:var(--ink);opacity:.38}
  input[type=url]:focus{outline:3px solid var(--violet);outline-offset:2px}
  button{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:23px;
    text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
    background:var(--ink);color:var(--concrete);border:2px solid var(--ink);
    padding:12px 26px;border-radius:0;transition:background .12s,color .12s;
  }
  button:hover:not(:disabled){background:var(--violet);border-color:var(--violet)}
  button:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--ink)}
  button.ghost:hover:not(:disabled){background:var(--ink);color:var(--concrete)}

  .note{font-family:'JetBrains Mono',monospace;font-size:11.5px;opacity:.55;line-height:1.6}

  /* ---- result ---- */
  .result{display:none;margin-top:38px;gap:clamp(20px,4vw,34px);
    grid-template-columns:var(--frame-w) 1fr;align-items:start}
  .result.show{display:grid}
  @media (max-width:600px){.result.show{grid-template-columns:1fr;justify-items:center}}

  /* signature: a 9:16 frame that fills from the bottom as bytes arrive */
  .frame{
    position:relative;width:var(--frame-w);aspect-ratio:9/16;
    border:2px solid var(--ink);background:var(--concrete-deep);overflow:hidden;
  }
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .fill{
    position:absolute;left:0;right:0;bottom:0;height:0%;
    background:color-mix(in srgb, var(--violet) 78%, transparent);
    transition:height .45s cubic-bezier(.22,.61,.36,1);
  }
  .pct{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-family:'Big Shoulders Display',sans-serif;font-weight:900;
    font-size:clamp(64px,17vw,104px);color:var(--concrete);line-height:1;
    mix-blend-mode:difference;pointer-events:none;
  }
  .working .pct{display:flex}
  .ticks{position:absolute;top:0;bottom:0;right:8px;display:flex;flex-direction:column;
    justify-content:space-between;padding:10px 0;pointer-events:none}
  .ticks span{width:14px;height:2px;background:var(--ink);opacity:.28}

  .meta h2{font-family:'Big Shoulders Display',sans-serif;font-weight:700;
    font-size:clamp(30px,5vw,42px);line-height:.95;text-transform:uppercase;margin-bottom:10px}
  dl{font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:22px}
  dl div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid rgba(16,22,25,.14)}
  dt{opacity:.5;min-width:88px;text-transform:uppercase;letter-spacing:.08em}
  dd{font-weight:500}
  .actions{display:flex;gap:10px;flex-wrap:wrap}

  .status{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7}
  .status.err{color:#9b1c1c;border-left:3px solid #9b1c1c;padding-left:12px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">

  <header>
    <h1>Ver<em>ti</em>cal</h1>
    <p class="sub">Shorts downloader<br>yt-dlp · self-hosted</p>
  </header>

  <form id="f">
    <input id="url" type="url" placeholder="Paste a youtube.com/shorts/… link" required
           autocomplete="off" spellcheck="false">
    <button type="submit" id="load">Look up</button>
  </form>
  <p class="note">Runs on your own machine. Nothing leaves this server.</p>

  <section class="result" id="result">
    <div class="frame" id="frame">
      <img id="thumb" alt="">
      <div class="fill" id="fill"></div>
      <div class="pct" id="pct">0</div>
      <div class="ticks"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="meta">
      <h2 id="title"></h2>
      <dl id="facts"></dl>
      <div class="actions">
        <button id="mp4">Save MP4</button>
        <button id="mp3" class="ghost">Save MP3</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
  </section>

</div>

<script>
const $ = id => document.getElementById(id);
const state = { url: null, polling: null };

const secs = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const mb = b => b ? `${(b/1048576).toFixed(1)} MB` : '—';

function say(msg, isError){
  $('status').textContent = msg || '';
  $('status').classList.toggle('err', !!isError);
}

function busy(on){
  ['mp4','mp3','load'].forEach(id => $(id).disabled = on);
  $('frame').classList.toggle('working', on);
}

function progress(p){
  $('fill').style.height = p + '%';
  $('pct').textContent = Math.round(p);
}

async function api(path, body){
  const res = await fetch(path, body ? {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  } : undefined);
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
  return data;
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  busy(true); say('Reading video details…');
  try{
    const info = await api('/api/info', { url: $('url').value });
    state.url = $('url').value;

    $('thumb').src = info.thumbnail || '';
    $('thumb').alt = info.title || '';
    $('title').textContent = info.title || 'Untitled';
    $('facts').innerHTML = [
      ['Channel', info.uploader || '—'],
      ['Length', info.duration ? secs(info.duration) : '—'],
      ['Frame', info.resolution ? `${info.resolution}${info.vertical ? ' · vertical' : ' · landscape'}` : '—'],
      ['Approx.', mb(info.filesize)],
    ].map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');

    $('result').classList.add('show');
    progress(0); say('');
  }catch(err){ say(err.message, true); }
  finally{ busy(false); }
});

async function download(kind){
  if(!state.url) return;
  busy(true); progress(0); say('Starting…');
  try{
    const job = await api('/api/jobs', { url: state.url, kind });
    state.polling = setInterval(async () => {
      try{
        const s = await api(`/api/jobs/${job.id}`);
        progress(s.percent);
        if(s.state === 'running'){
          say(s.speed ? `Downloading at ${s.speed}${s.eta ? ` · ${s.eta}s left` : ''}` : 'Downloading…');
        }
        if(s.state === 'done'){
          clearInterval(state.polling); busy(false);
          say(`Saved ${s.filename}`);
          window.location.href = `/api/jobs/${job.id}/file`;
        }
        if(s.state === 'error'){
          clearInterval(state.polling); busy(false); progress(0);
          say(s.error, true);
        }
      }catch(err){
        clearInterval(state.polling); busy(false); say(err.message, true);
      }
    }, 700);
  }catch(err){ busy(false); say(err.message, true); }
}

$('mp4').addEventListener('click', () => download('video'));
$('mp3').addEventListener('click', () => download('audio'));
</script>
</body>
</html>
