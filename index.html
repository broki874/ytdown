<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Shorts Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎥 YouTube Shorts Downloader</h1>
    <p>Paste a Shorts URL and download instantly</p>

    <input type="text" id="urlInput" placeholder="https://www.youtube.com/shorts/..." />
    <button id="downloadBtn">Download Short</button>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
