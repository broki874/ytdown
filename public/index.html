<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Downloader</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f4f4f4; }
    input { width: 70%; padding: 15px; font-size: 18px; margin: 20px 0; }
    button { padding: 15px 30px; background: #FF0000; color: white; border: none; font-size: 18px; cursor: pointer; }
    .format { padding: 15px 25px; background: #333; color: white; margin: 10px; display: inline-block; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🎥 YouTube Video Downloader</h1>
  <form id="form">
    <input type="text" id="url" placeholder="Paste YouTube URL" required>
    <button type="submit">Get Download Links</button>
  </form>
  <div id="results"></div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      const results = document.getElementById('results');
      results.innerHTML = '<p>Loading...</p>';

      try {
        const res = await fetch('/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        let html = `<h2>${data.title || 'Video'}</h2>`;

        if (data.url) {
          html += `<a href="${data.url}" class="format" target="_blank">📥 Download Video</a>`;
        } else if (data.picker) {
          data.picker.forEach(item => {
            html += `<a href="${item.url}" class="format" target="_blank">${item.name || 'Download'}</a>`;
          });
        } else {
          html += `<p class="error">No download link found. Try a different video.</p>`;
        }

        results.innerHTML = html;
      } catch (err) {
        results.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
